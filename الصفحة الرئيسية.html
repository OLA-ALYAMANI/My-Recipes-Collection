<!DOCTYPE html>
<html lang="ar">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./Css/style.css">
    <link rel="stylesheet" href="./Css/recipe-card.css">
    <title>وصفاتي</title>
</head>

<body>
    <!-- START HEADER -->
    <header class="header-area">
        <div class="header-list">
            <nav class="navbar">
                <a href="الصفحة الرئيسية.html" class="navbar-link">تـــي<img class="logo" src="./img/icons8-spatula-100.png"/>وصــــفــا
                </a>
                <button class="navbar-toggler">
                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>
                </button>
            
                <div class="navbar-list" id="navbarNav">
                    <div class="navbar-nav">
                        <div class="nav-item">
                            <a class="nav-link" href="/الصفحة الرئيسية.html">الرئيسية</a>
                        </div>
                    </div>
                    <div class="navbar-nav">
                        <div class="nav-item">
                            <a class="nav-link" href="/جميع الوصفات">الوصفات</a>
                        </div>
                    </div>
                    
                    <div class="navbar-nav">
                        <div class="nav-item">
                            <button class="add-btn" id="addRecipe">اضافة وصفة جديدة +</button>
                        </div>
                    </div>
                </div>
            </nav>
        </div>
    </header>
    <!-- END HEADER -->

    <!-- START MAIN AREA -->
<main>
    <section class="home-banner">
        <div class="container">
            <div class="main-area">
                <div class="img-card">
                    <img src="./img/imad-786-n5I4Ix008-0-unsplash.jpg" alt="">
                </div>
                <div class="img-card">
                    <img src="./img/Cream-of-Mushroom-Soup-IMAGE-135.jpg" alt="">
                </div>
                <div class="img-card">
                    <img src="./img/Mongolian-Beef-3.jpg" alt="">
                </div>
                <div class="img-card">
                    <img src="./img/kobby-mendez-idTwDKt2j2o-unsplash.jpg" alt="">
                </div>
            </div>
        </div>
    </section>

    <section class="recipe-area">
        <div class="contianer">
            <div class="favorite-title">
                <h1>وصفـات مميـزة</h1>
                <p>وصفات اعود الـيها باستمرار</p>
            </div>
            
            <div class="search">
                <div class="search-contianer">
                    <div class="search-icon"></div>
                    <input class="searchBox" type="text" dir="rtl" id="searchInput" placeholder="ابحث هنا ...">
                    <button class="search-btn">بحث</button>
                </div>
            </div>

            <div class="wrapper">
                <div class="cards">
                    <div class="front-face">
                        <div class="card-header">
                            <div class="options_title">أطباق رئيسية</div>
                            <button class="rec-fav-img">
                                <img class="fav-icon" src="./img/love.png" alt="">
                            </button>
                            <button class="flip-btn" type="button"> ↪ انقر لقلب البطاقة</button>
                        </div>
                        <img class="recp-img" id="front-img" src="/img/Chiffon-Cake-Recipe-Card.jpg" alt="">
                        <div class="card-bottom">
                            <h3 class="recipe-title">الكيكة الاسفنجية</h3>
                        </div>
                    </div>
                    <div class="back-face">
                        <img class="recp-img" id="back-img" src="/img/Chiffon-Cake-Recipe-Card.jpg" alt="">
                        <div class="info">
                            <h3 class="recipe-title">الكيكة الاسفنجية</h3>
                            <p>: وقت التحضير<br>: وقت الطهي</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <section class="favorite-reicpe-area">
        
    </section>
</main>
    
    <script src="./Js/main.js"></script>
    <script src="./Js/reipe-card.js"></script>
</body>

</html>
