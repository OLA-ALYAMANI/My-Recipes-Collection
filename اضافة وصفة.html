<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./Css/style.css">
    <link rel="stylesheet" href="./Css/add-recipe.css">
    <title>أضافة وصفة</title>
</head>
<body>
    <!--START HEADER-->
    <header class="header-area">
        <div class="header-list">
            <nav class="navbar">
                <a href="الصفحة الرئيسية.html" class="navbar-link">تـــي<img class="logo" src="./img/icons8-spatula-100.png"/>وصــــفــا
                </a>
            </nav>
            <div class="navbar-list" id="navbarNav">
                <div class="navbar-nav">
                    <div class="nav-item">
                        <a class="nav-link" href="#">الرئيسية</a>
                    </div>
                </div>
                <div class="navbar-nav">
                    <div class="nav-item">
                        <a class="nav-link" href="#جميع الوصفات">الوصفات</a>
                    </div>
                </div>
                <div class="search">
                    <div class="search-icon"></div>
                    <div class="close-icon"></div>
                </div>
                <div class="searchBox">
                    <input type="text" dir="rtl" id="searchInput" placeholder="ابحث هنا ...">
                </div>
                <div class="navbar-nav">
                    <div class="nav-item">
                        <button class="add-btn">اضافة وصفة جديدة +</button>
                    </div>
                </div>
            </div>
        </div>
    </header>
    <!--END HEADER-->
        <section class="recip-area">
            <div id="add-recipe" class="container" >
                <h1>إضافة وصفة جديدة</h1>
                <form id="recipe-form">
                    <div class="form-group">
                        <label>اسم الوصفة:</label>
                        <input type="text" id="title" required placeholder="مثلاً: مكرونة بالبشاميل">
                    </div>
                    <div class="form-group">
                        <label>رابط صورة الوصفة:</label>
                        <input type="url" id="image" placeholder="ضع رابط صورة من الإنترنت">
                    </div>
                    <div class="form-group">
                        <label>المكونات (فصل بينها بفاصلة):</label>
                        <textarea id="ingredients" rows="3" placeholder="طحين, سكر, بيض..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>طريقة التحضير:</label>
                        <textarea id="instructions" rows="5" placeholder="اكتب الخطوات هنا..."></textarea>
                    </div>
                    <button type="submit" class="btn-submit">حفظ الوصفة</button>
                </form>
            </div>
        </section>
</body>
</html>
