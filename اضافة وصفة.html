<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./Css/style.css">
    <link rel="stylesheet" href="./Css/add-recipe.css">
    <title>أضافة وصفة</title>
</head>
<body>
    <!--START HEADER-->
    <header class="header-area">
        <div class="header-list">
            <nav class="navbar">
                <button class="navbar-toggler" aria-label="Toggle navigation" aria-expanded="false">
                        <span class="bar"></span>
                        <span class="bar"></span>
                        <span class="bar"></span>
                    </button>
                <div class="navbar-list" id="navbarNav">
                    
                    <div class="navbar-nav">
                        <div class="nav-item">
                            <button class="add-btn" id="addRecipe">اضافة وصفة جديدة +</button>
                        </div>
                    </div>
                    <div class="navbar-nav">
                        <div class="nav-item">
                            <a class="nav-link" href="/جميع الوصفات">الوصفات</a>
                        </div>
                    </div>
                    <div class="navbar-nav">
                        <div class="nav-item">
                            <a class="nav-link" href="/الصفحة الرئيسية.html">الرئيسية</a>
                        </div>
                    </div>
                </div>
                 <a href="الصفحة الرئيسية.html" class="navbar-link">تـــي<img class="logo" src="./img/icons8-spatula-100.png"/>وصــــفــا
                </a>
                
            </nav>
        </div>
    </header>
    <!--END HEADER-->
        <section class="recipe-area">
            <div id="add-recipe" class="container">
                <div class="form">
                    <div class="top-side">
                        <h1>أهـلا وسـهلا</h1>
                        <p>اضف وصفاتك الرئعة هنا</p>
                        <p>نتمنى لك ولعائلتك يوماً لذيذاً</p>
                    </div>
                    <div class="bottom-side">
                        <h1 class="add-title">إضافة وصفة جديدة</h1>
                        <form id="recipe-form">
                            <div class="form-group">
                                <label>:اسم الوصفة</label>
                                <input type="text" id="title" required placeholder="مثلاً: مكرونة بالبشاميل">
                            </div>
                            <div class="form-group">
                                <label>:صورة الوصفة</label>
                                <input type="file" id="image" placeholder="تحميل صورة . . ." multiple hidden>
                            </div>
                            <div class="dish-time-container">
                                <div class="form-group time">
                                    <label>وقت التحضير:</label>
                                    <input type="text"  placeholder="مثال: 30 دقيقة" id="Prepare-time">
                                </div>
                                <div class="form-group">
                                    <label>التصنيف:</label>
                                        <select name="" id="options" class="recp-option">
                                            <option value="أطباق رئيسية">أطباق رئيسية</option>
                                            <option value="حلويات">حلويات</option>
                                            <option value="مقبلات وسلطات">مقبلات وسلطات</option>
                                            <option value="معجنات وفطائر">معجنات وفطائر</option>
                                            <option value="شوربات ومشروبات">شوربات ومشروبات</option>
                                        </select>
                                </div>
                            </div>
                            <div class="form-group">
                                <label>:المكونات (فصل بينها بفاصلة)</label>
                                <textarea id="ingredients" rows="3" placeholder="طحين, سكر, بيض..."></textarea>
                            </div>
                            <div class="form-group">
                                <label>:طريقة التحضير</label>
                                <textarea id="instructions" rows="5" placeholder="اكتب الخطوات هنا..."></textarea>
                            </div>
                            <button type="submit" class="btn-submit">حفظ الوصفة</button>
                        </form>
                    </div>
                </div>
            </div>
        </section>
      
        <script src="./Js/main.js"></script>
</body>
</html>
